# THROWAWAY test copy used only by installer\use-existing-db.ps1 (dry run of the upgrade).
# Own project (erp-dryrun), own SQL container, own volume, own port. Nothing here touches minierp-db, erp-db or erp_sql_data.
# "docker compose -p erp-dryrun -f docker-compose.dryrun.yml down -v" removes only the objects defined in this file.
name: erp-dryrun

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: erp-dryrun-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DRYRUN_SA_PASSWORD:?DRYRUN_SA_PASSWORD missing}
      MSSQL_MEMORY_LIMIT_MB: "1536"
    volumes:
      - dryrun_data:/var/opt/mssql

  api:
    image: erp-api:${ERP_VERSION:-2.0}
    container_name: erp-dryrun-api
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Server=db,1433;Database=MiniErp;User Id=sa;Password=${DRYRUN_SA_PASSWORD:?DRYRUN_SA_PASSWORD missing};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True
      Jwt__SigningKey: ${DRYRUN_JWT:?DRYRUN_JWT missing}
      Database__ApplyMigrationsOnStartup: "true"
      Seed__Enabled: "false"
      Swagger__Enabled: "false"
    ports:
      - "127.0.0.1:${DRYRUN_API_PORT:?DRYRUN_API_PORT missing}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  dryrun_data:
