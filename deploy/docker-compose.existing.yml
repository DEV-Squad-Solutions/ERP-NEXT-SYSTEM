# ERP 2.0 on an EXISTING SQL Server container (for example the old minierp-db). No new database is created.
# Used only by installer\use-existing-db.ps1 (docker compose -p erp -f docker-compose.existing.yml up -d).
# The API upgrades the existing MiniErp database in place (EF migrations on startup) AFTER a verified backup.
# The old SQL container and its volume are never started, stopped, removed or deleted by this file.
name: erp

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    image: erp-api:${ERP_VERSION:-2.0}
    container_name: erp-api
    restart: unless-stopped
    logging: *logging
    networks:
      - default
      - legacy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Server=${EXISTING_DB_HOST:?EXISTING_DB_HOST missing in .env},1433;Database=${EXISTING_DB_NAME:-MiniErp};User Id=sa;Password=${EXISTING_DB_PASSWORD:?EXISTING_DB_PASSWORD missing in .env};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY missing in .env}
      Setup__Token: ${SETUP_TOKEN:-}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-}
      Database__ApplyMigrationsOnStartup: "true"
      Seed__Enabled: "false"
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
    ports:
      - "${ERP_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  frontend:
    image: erp-frontend:${ERP_VERSION:-2.0}
    container_name: erp-frontend
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ERP_WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

networks:
  legacy:
    external: true
    name: ${EXISTING_DB_NETWORK:?EXISTING_DB_NETWORK missing in .env}
