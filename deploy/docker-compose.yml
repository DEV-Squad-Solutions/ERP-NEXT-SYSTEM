# ERP على السيرفر: قاعدة بيانات + API + واجهة (nginx). بدون build على السيرفر.
# الصور بتتحمل من erp-images-<version>.tar بواسطة install-or-update.bat (اسم الإصدار في ERP_VERSION).
# لازم جنبه ملف .env (شوف .env.example). الداتا في volume اسمه sql_data (erp_sql_data) ومتتحذفش.
# ممنوع: docker compose down -v  /  docker volume rm  /  docker system prune --volumes
name: erp

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: erp-db
    restart: unless-stopped
    logging: *logging
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?SQL_SA_PASSWORD missing in .env}
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  api:
    image: erp-api:${ERP_VERSION:-2.0}
    container_name: erp-api
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Server=db,1433;Database=MiniErp;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY missing in .env}
      Database__ApplyMigrationsOnStartup: "true"
      Seed__Enabled: "false"
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
    ports:
      - "${ERP_API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  frontend:
    image: erp-frontend:${ERP_VERSION:-2.0}
    container_name: erp-frontend
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ERP_WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  sql_data:
