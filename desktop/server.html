<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Dev Squad ERP</title>
<style>
 body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0f17;color:#e6edf7;font-family:Segoe UI,Tahoma,sans-serif}
 .card{width:min(440px,90vw);background:#121826;border:1px solid #1f2a3d;border-radius:16px;padding:28px;box-shadow:0 10px 40px #0008;animation:in .3s ease both}
 @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
 h1{font-size:20px;margin:0 0 6px}p{margin:0 0 16px;color:#8ea0bb;font-size:13px;line-height:1.6}
 input{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:10px;border:1px solid #2a3750;background:#0b0f17;color:#e6edf7;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
 input:focus{border-color:#22b8e6;box-shadow:0 0 0 4px #22b8e622}
 button{margin-top:14px;width:100%;padding:12px;border:0;border-radius:10px;background:#2f7cf6;color:#fff;font-weight:600;font-size:14px;cursor:pointer;transition:transform .15s,filter .2s}
 button:hover{filter:brightness(1.1)}button:active{transform:scale(.98)}
 .err{color:#ff7b7b;margin-top:12px;font-size:13px;min-height:18px}
 @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div class="card">
<h1>Dev Squad ERP</h1>
<p>Enter the address of your ERP server, for example <b>http://192.168.1.5:8080</b>. Ask your administrator if you do not know it.</p>
<input id="u" placeholder="http://192.168.1.5:8080" dir="ltr" autofocus>
<button id="b">Connect</button>
<div class="err" id="e"></div>
</div>
<script>
 const q=new URLSearchParams(location.search);
 document.getElementById('u').value=q.get('current')||'';
 document.getElementById('e').textContent=q.get('message')||'';
 async function go(){
   const r=await window.erpDesktop.setServer(document.getElementById('u').value);
   if(!r.ok) document.getElementById('e').textContent=r.error;
 }
 document.getElementById('b').onclick=go;
 document.getElementById('u').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
</script></body></html>
